name: Python Build

permissions:
  contents: read
  packages: write
  deployments: write

on:
  push:
   branches: [ feature-task1 ]


  workflow_dispatch:
    inputs:
      environment: 
        description: 'Select the environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:  
          - dev
          - stage
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest || echo "No tests found, skipping..."
      
      
      
      - name: Docker build
        run: |
          docker build -t python-pw-app .

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker push
        run: |
          docker tag python-pw-app:latest ${{ secrets.DOCKER_USERNAME }}/python-pw-app:${{ date('YmdHis') }}
          docker push ${{ secrets.DOCKER_USERNAME }}/python-pw-app:${{ date('YmdHis') }}