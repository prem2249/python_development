<!DOCTYPE html>
<html>
<head>
    <title>Phishing Email Detector</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Phishing Email Detection</h1>
    <form method="POST" enctype="multipart/form-data">
        <textarea name="email" placeholder="Paste email content here..." rows="8" cols="60"></textarea><br>
        <p>OR upload a file (CSV, TXT, PDF):</p>
        <input type="file" name="file"><br><br>
        <button type="submit">Check Email</button>
    </form>
    {% if result %}
        <h2>Result: {{ result }}</h2>
        <img src="/static/confusion_matrix.png" alt="Confusion Matrix" width="400">
    {% endif %}
</body>
</html>
