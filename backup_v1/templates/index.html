<!DOCTYPE html>
<html>
<head>
    <title>Vulnerability Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        function showLoading() {
            document.getElementById("loading").style.display = "block";
        }
        function toggleOptions() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            document.getElementById("range-options").style.display = (mode === "range") ? "block" : "none";
            document.getElementById("list-options").style.display = (mode === "list") ? "block" : "none";
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>🔍 <span class="title">Vulnerability Scanner</span></h1>
        <p class="subtitle">Scan a domain or IP for open ports, weak configurations, and outdated versions.</p>

        <form method="post" onsubmit="showLoading()" class="scan-form">
            <label>Target:</label>
            <input type="text" name="target" placeholder="e.g. 192.168.1.1 or example.com" required>

            <label>Port Scan Mode:</label>
            <div class="radio-group">
                <label><input type="radio" name="mode" value="common" checked onclick="toggleOptions()"> Common Ports</label>
                <label><input type="radio" name="mode" value="range" onclick="toggleOptions()"> Range</label>
                <label><input type="radio" name="mode" value="list" onclick="toggleOptions()"> Custom List</label>
            </div>

            <div id="range-options" class="range-input" style="display:none;">
                <label>Range:</label>
                <input type="number" name="start" value="1"> to
                <input type="number" name="end" value="1024">
            </div>

            <div id="list-options" class="custom-input" style="display:none;">
                <label>Custom Ports (comma separated):</label>
                <input type="text" name="custom_ports" placeholder="80,443,8080">
            </div>

            <button type="submit" class="scan-btn">🚀 Start Scan</button>
        </form>

        <div id="loading" style="display:none;" class="loading-box">
            <p>⏳ Scanning in progress…</p>
            <progress value="0" max="100" id="progressBar"></progress>
            <div class="spinner"></div>
            <script>
                let progress = 0;
                let interval = setInterval(function() {
                    if (progress < 90) {
                        progress += 10;
                        document.getElementById("progressBar").value = progress;
                    } else {
                        clearInterval(interval);
                    }
                }, 800);
            </script>
        </div>

        {% if report %}
        <div class="results-card">
            <h2>📊 Scan Results</h2>
            <pre>{{ report|safe }}</pre>
            <a href="{{ url_for('download', filename=filename) }}" class="download-btn">⬇️ Download Report</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
